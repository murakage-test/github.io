<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>経費精算システム（SPA画面移動テスト）</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --muted:#5b636e; --line:#d8dce2; --accent:#1a5fb4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181c; --card:#1f2226; --text:#e6e8eb; --muted:#9aa3ad; --line:#353a41; --accent:#6ea8fe; }
    }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; line-height:1.6; }
    header { background:var(--accent); color:#fff; padding:12px 16px; }
    header h1 { margin:0; font-size:1.1rem; }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .note { font-size:.85rem; color:var(--muted); border:1px dashed var(--line); padding:8px 12px; border-radius:6px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin:16px 0; }
    .card h2 { font-size:1rem; margin:0 0 8px; }
    dl { margin:0; font-size:.9rem; }
    dt { font-weight:600; margin-top:6px; }
    dd { margin:0 0 0 1em; }
    nav { display:flex; gap:8px; }
    nav button { padding:6px 14px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); cursor:pointer; }
    nav button[aria-current="page"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  </style>
</head>
<body>
  <header><h1>経費精算システム（SPA画面移動テスト）</h1></header>
  <main>
    <p class="note">これはブラウザ搭載AIの読み取り範囲を確かめるためのテストページです。記載内容はすべて架空です。</p>
    <section class="card">
      <h2>お知らせ</h2>
      <p>経費申請の締め切りは 毎月17日 15時 です。</p>
    </section>
    <nav>
      <button type="button" data-view="home">ホーム</button>
      <button type="button" data-view="help">ヘルプ</button>
    </nav>
    <section class="card" id="view"></section>
  </main>
  <script>
    // ページを読み直さずに、中身だけを書き換える（SPA の想定）。URL は ?view= で変わる。
    var views = {
      home: '<h2>ホーム</h2><p>上のボタンで画面を切り替えられます。</p>',
      help: '<h2>ヘルプ</h2><dl><dt>Q：このアプリで代理申請できるのは誰ですか？</dt><dd>A：同じ課の 主任以上 の社員が代理申請できます。</dd></dl>'
    };
    function show(name, push) {
      document.getElementById('view').innerHTML = views[name];
      document.querySelectorAll('nav button').forEach(function (b) {
        if (b.dataset.view === name) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
      if (push) history.pushState({ view: name }, '', '?view=' + name);
    }
    document.querySelectorAll('nav button').forEach(function (b) {
      b.addEventListener('click', function () { show(b.dataset.view, true); });
    });
    window.addEventListener('popstate', function (e) { show((e.state && e.state.view) || 'home', false); });
    show(new URLSearchParams(location.search).get('view') === 'help' ? 'help' : 'home', false);
  </script>
</body>
</html>
