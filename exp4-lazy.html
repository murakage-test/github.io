<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>経費精算システム（遅延読み込みテスト）</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --muted:#5b636e; --line:#d8dce2; --accent:#1a5fb4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181c; --card:#1f2226; --text:#e6e8eb; --muted:#9aa3ad; --line:#353a41; --accent:#6ea8fe; }
    }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; line-height:1.6; }
    header { background:var(--accent); color:#fff; padding:12px 16px; }
    header h1 { margin:0; font-size:1.1rem; }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .note { font-size:.85rem; color:var(--muted); border:1px dashed var(--line); padding:8px 12px; border-radius:6px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin:16px 0; }
    .card h2 { font-size:1rem; margin:0 0 8px; }
    dl { margin:0; font-size:.9rem; }
    dt { font-weight:600; margin-top:6px; }
    dd { margin:0 0 0 1em; }
    .spacer { height:3000px; display:flex; align-items:flex-end; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <header><h1>経費精算システム（遅延読み込みテスト）</h1></header>
  <main>
    <p class="note">これはブラウザ搭載AIの読み取り範囲を確かめるためのテストページです。記載内容はすべて架空です。</p>
    <section class="card">
      <h2>お知らせ</h2>
      <p>経費申請の締め切りは 毎月17日 15時 です。</p>
    </section>
    <div class="spacer">↓ この下に「よくある質問」があります</div>
    <section class="card" aria-labelledby="faq">
      <h2 id="faq">よくある質問</h2>
      <div id="faq-area">（画面に入ったら読み込みます）</div>
    </section>
  </main>
  <script>
    // 画面に入ったときに初めて描画する（遅延読み込み・無限スクロールの想定）。
    var area = document.getElementById('faq-area');
    new IntersectionObserver(function (entries, ob) {
      if (!entries[0].isIntersecting) return;
      ob.disconnect();
      area.innerHTML = '<dl><dt>Q：このアプリの交通費の精算期限は？</dt><dd>A：交通費は 利用日から60日以内 に精算してください。</dd></dl>';
    }).observe(area);
  </script>
</body>
</html>
