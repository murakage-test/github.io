<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>経費精算システム（大量情報テストC）</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --muted:#5b636e; --line:#d8dce2; --accent:#1a5fb4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181c; --card:#1f2226; --text:#e6e8eb; --muted:#9aa3ad; --line:#353a41; --accent:#6ea8fe; }
    }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; line-height:1.6; }
    header { background:var(--accent); color:#fff; padding:12px 16px; }
    header h1 { margin:0; font-size:1.1rem; }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .note { font-size:.85rem; color:var(--muted); border:1px dashed var(--line); padding:8px 12px; border-radius:6px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin:16px 0; }
    .card h2 { font-size:1rem; margin:0 0 8px; }
    dl { margin:0; font-size:.9rem; }
    dt { font-weight:600; margin-top:6px; }
    dd { margin:0 0 0 1em; }
    .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); }
    .tabs button { padding:6px 12px; border:1px solid var(--line); border-bottom:0; border-radius:6px 6px 0 0; background:var(--bg); color:var(--text); }
    .tabs button[aria-selected="true"] { background:var(--card); font-weight:600; }
    .panel { padding:12px 0; }
  </style>
</head>
<body>
  <header><h1>経費精算システム（大量情報テストC）</h1></header>
  <main>
    <p class="note">これはブラウザ搭載AIの読み取り範囲を確かめるためのテストページです。記載内容はすべて架空です。件数：<span id="count">-</span></p>
    <section class="card">
      <h2>お知らせ</h2>
      <p>経費申請の締め切りは 毎月17日 15時 です。</p>
    </section>
    <section class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" aria-controls="tab-basic" id="t1">基本情報</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="tab-faq" id="t2">よくある質問</button>
      </div>
      <div class="panel" role="tabpanel" id="tab-basic" aria-labelledby="t1"><p>経費の申請はこの画面から行えます。</p></div>
      <div class="panel" role="tabpanel" id="tab-faq" aria-labelledby="t2" hidden><div id="faq-area">読み込み中…</div></div>
    </section>
  </main>
  <script src="large-common.js"></script>
  <script>
    setTimeout(function () {
      renderFaq(document.getElementById('faq-area'), 'このアプリの次期リリース予定日は？', 'このアプリの次期リリース予定日は 2027年2月19日 です。');
      document.querySelectorAll('[role=tab]').forEach(function (t) {
        t.addEventListener('click', function () {
          document.querySelectorAll('[role=tab]').forEach(function (x) {
            var on = x === t; x.setAttribute('aria-selected', on);
            document.getElementById(x.getAttribute('aria-controls')).hidden = !on;
          });
        });
      });
    }, 800);
  </script>
</body>
</html>
