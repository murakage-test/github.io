<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>経費精算システム（検証用）</title>

  <!-- [6] meta description にだけ書いた情報 -->
  <meta name="description" content="経費精算システム。このアプリの開発コードネームは「ミズナラ」です。">

  <!-- [7] 独自 meta にだけ書いた情報 -->
  <meta name="app-info" content="このアプリのサポート窓口は 内線 4721 です。">

  <!-- [9] meta / link で情報源URLだけを示す（本文にはリンクなし） -->
  <meta name="app-info-source" content="help.html">
  <link rel="help" href="help.html">

  <!-- [10] AI向け Markdown 版の情報源（本文にはリンクなし） -->
  <link rel="alternate" type="text/markdown" href="app-guide.md" title="AI向けアプリ情報">

  <!-- [8] JSON-LD にだけ書いた情報 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "経費精算システム（検証用）",
    "applicationCategory": "BusinessApplication",
    "softwareVersion": "7.3.9",
    "description": "このアプリの現在のバージョンは 7.3.9 です。"
  }
  </script>

  <style>
    :root { --bg:#f5f6f8; --card:#fff; --text:#1f2328; --muted:#5b636e; --line:#d8dce2; --accent:#1a5fb4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181c; --card:#1f2228; --text:#e6e8eb; --muted:#9aa3ad; --line:#353a42; --accent:#7fb0ff; }
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
    header { background:var(--accent); color:#fff; padding:12px 16px; }
    header h1 { margin:0; font-size:1.1rem; }
    main { max-width:820px; margin:0 auto; padding:16px; }
    .note { font-size:.85rem; color:var(--muted); border:1px dashed var(--line); padding:8px 12px; border-radius:6px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin:16px 0; }
    .card h2 { font-size:1rem; margin:0 0 8px; }
    label { display:block; font-size:.9rem; margin-top:8px; }
    input, select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--text); }
    button { margin-top:12px; padding:8px 16px; border:0; border-radius:4px; background:var(--accent); color:#fff; }
    .hidden-info { display:none; }
    footer { max-width:820px; margin:0 auto; padding:16px; font-size:.9rem; color:var(--muted); }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <header><h1>経費精算システム（検証用）</h1></header>

  <main>
    <p class="note">これはブラウザ搭載AIの読み取り範囲を確かめるためのテストページです。記載内容はすべて架空です。</p>

    <!-- [1] 画面に表示される本文 -->
    <section class="card" aria-labelledby="news">
      <h2 id="news">お知らせ</h2>
      <p>経費申請の締め切りは 毎月17日 15時 です。締め切りを過ぎた申請は翌月の処理になります。</p>
    </section>

    <section class="card" aria-labelledby="form">
      <h2 id="form">経費を申請する</h2>
      <label>利用日 <input type="date"></label>
      <label>費目
        <select><option>交通費</option><option>宿泊費</option><option>会議費</option></select>
      </label>
      <label>金額（円） <input type="number" min="0"></label>
      <button type="button">申請する</button>
    </section>

    <!-- [2] 折りたたみ（初期状態は閉じている） -->
    <details class="card">
      <summary>承認の流れ</summary>
      <p>申請はまず 第4開発課 課長代理 が承認します。</p>
    </details>

    <!-- [3] JavaScript で読み込み後に描画（SPA の想定） -->
    <section class="card" aria-labelledby="dept">
      <h2 id="dept">所属情報</h2>
      <p id="js-area">読み込み中…</p>
    </section>

    <!-- [4] display:none で隠した本文 -->
    <p class="hidden-info">このアプリの保守担当は チーム・コハク です。</p>

    <!-- [5] HTML コメントにだけ書いた情報: このアプリの予備サーバー名は kumo-07 です。 -->
  </main>

  <!-- [12] 画面に見えるリンク -->
  <footer>
    詳しい使い方は <a href="manual.html">操作マニュアル</a> をご覧ください。
  </footer>

  <script>
    setTimeout(function () {
      document.getElementById('js-area').textContent = 'このアプリを利用する部署の部署コードは QX-58 です。';
    }, 800);
  </script>
</body>
</html>
